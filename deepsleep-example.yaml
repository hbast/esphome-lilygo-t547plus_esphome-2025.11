# ═══════════════════════════════════════════════════════════
# DeepSleep Demo for LilyGo T5 4.7" Plus E-Paper Display
# ═══════════════════════════════════════════════════════════
# 
# This program demonstrates the DeepSleep functionality:
#
# 1. Device boots and connects to WiFi
# 2. Synchronizes time with Home Assistant
# 3. Updates the E-Paper display with:
#    - Current time
#    - Boot counter (persisted across DeepSleep cycles)
#    - WiFi signal strength
#    - IP address
# 4. Enters DeepSleep after ~12 seconds (sleeps for 5 minutes)
# 5. Wakes up automatically after 5 minutes OR
#    by pressing the button on GPIO21
#
# Power consumption in DeepSleep: ~40-50µA (typical)
# Awake time: ~10-15 seconds per cycle
#
# ═══════════════════════════════════════════════════════════

esphome:
  name: epaper-test
  friendly_name: epaper-test

  on_boot:
    - priority: 600
      then:
        - lambda: |-
            ESP_LOGI("boot", "=== Device Boot ===");
            ESP_LOGI("boot", "Boot count: %d", id(boot_counter));
            ESP_LOGI("boot", "Free heap: %d bytes", heap_caps_get_free_size(MALLOC_CAP_8BIT));
            ESP_LOGI("boot", "Free PSRAM: %d bytes", heap_caps_get_free_size(MALLOC_CAP_SPIRAM));

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
    # CRITICAL for ESP-IDF 5.4.2+: Enable PSRAM initialization
    sdkconfig_options:
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_SPEED_80M: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "16384"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_ESP32S3_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_BOOT_INIT: "y"
      CONFIG_SPIRAM_IGNORE_NOTFOUND: "n"

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "ukhS8iah+AyqjgwNxY4h4BkeJGg1g1QSXyrxcQaoTmk="

ota:
  - platform: esphome
    password: "888395c8b8db25a3d22186d0e319e390"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fast connect for DeepSleep optimization
  fast_connect: true
  
  # Disable power saving for faster wake-up
  power_save_mode: none

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Epaper-Test Fallback Hotspot"
    password: "g5638sEEBKB7"

captive_portal:


# ═══════════════════════════════════════════════════════════
# DEEPSLEEP CONFIGURATION
# ═══════════════════════════════════════════════════════════
deep_sleep:
  id: deep_sleep_control
  # Sleep for 5 minutes
  sleep_duration: 5min
  
  # Wakeup on button press (GPIO21)
  wakeup_pin: GPIO21
  wakeup_pin_mode: INVERT_WAKEUP

# ═══════════════════════════════════════════════════════════
# GLOBAL VARIABLES (persisted across deep sleep)
# ═══════════════════════════════════════════════════════════
globals:
  - id: boot_counter
    type: int
    restore_value: yes
    initial_value: '0'

# ═══════════════════════════════════════════════════════════
# SENSORS
# ═══════════════════════════════════════════════════════════
sensor:
  # WiFi Signal strength
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
    on_value:
      then:
        - logger.log:
            format: "WiFi RSSI: %.1f dBm"
            args: ['x']
            level: DEBUG

  # Uptime in seconds (resets after deep sleep)
  - platform: uptime
    name: "Uptime"
    id: uptime_seconds
    update_interval: 10s
    on_value:
      then:
        # Warn if device has been awake too long
        - if:
            condition:
              lambda: 'return x > 90;'
            then:
              - logger.log:
                  format: "⚠️ Device awake for %.0f seconds - DeepSleep may not be working!"
                  args: ['x']
                  level: WARN

# ═══════════════════════════════════════════════════════════
# TEXT SENSORS
# ═══════════════════════════════════════════════════════════
text_sensor:
  # Deep Sleep status monitoring
  - platform: template
    name: "Deep Sleep Status"
    id: deep_sleep_status
    update_interval: 15s
    lambda: |-
      if (id(uptime_seconds).state < 15) {
        return {"Booting..."};
      } else if (id(uptime_seconds).state > 90) {
        return {"ERROR: Still awake!"};
      } else {
        return {"Preparing to sleep..."};
      }

# ═══════════════════════════════════════════════════════════
# BINARY SENSORS
# ═══════════════════════════════════════════════════════════
# Note: GPIO21 is used as wakeup_pin in deep_sleep configuration
# No separate binary_sensor needed - button press will wake device

# ═══════════════════════════════════════════════════════════
# TIME (for display)
# ═══════════════════════════════════════════════════════════
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        - logger.log: "Time synchronized with Home Assistant"

# ═══════════════════════════════════════════════════════════
# EXTERNAL COMPONENT
# ═══════════════════════════════════════════════════════════
external_components:
  - source:
      type: local
      path: components
    components: ["t547"]
  # Alternative: Use main branch from original repo
  # - source: github://dabalroman/esphome-lilygo-t547plus_esphome-2025.11
  #   components: ["t547"]
  # For local development:
  # - source:
  #     type: local
  #     path: components/
  #   components: ["t547"]

# ═══════════════════════════════════════════════════════════
# FONTS
# ═══════════════════════════════════════════════════════════
font:
  - file: 
      type: gfonts
      family: Roboto
      weight: 700
    id: font_large
    size: 60
    
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_medium
    size: 32
    
  - file:
      type: gfonts
      family: "Roboto Mono"
      weight: 400
    id: font_small
    size: 20

# ═══════════════════════════════════════════════════════════
# DISPLAY WITH DEEPSLEEP
# ═══════════════════════════════════════════════════════════
display:
  - platform: t547
    id: lilygo_display
    greyscale: true
    
    # Update display on boot, then enter deep sleep
    update_interval: never
    
    lambda: |-
      ESP_LOGI("display", "=== Updating Display ===");
      
      // Increment boot counter
      id(boot_counter) += 1;
      ESP_LOGI("display", "Boot count: %d", id(boot_counter));
      
      // Clear screen
      it.fill(COLOR_OFF);
      
      // Title
      it.printf(480, 50, id(font_large), TextAlign::TOP_CENTER, "DeepSleep Demo");
      
      // Line
      it.line(100, 130, 860, 130);
      
      // Boot counter
      it.printf(480, 180, id(font_medium), TextAlign::TOP_CENTER, 
                "Boot #%d", id(boot_counter));
      
      // Current time
      auto time = id(homeassistant_time).now();
      if (time.is_valid()) {
        it.strftime(480, 250, id(font_medium), TextAlign::TOP_CENTER,
                    "Last Update: %H:%M:%S", time);
        ESP_LOGI("display", "Current time: %02d:%02d:%02d", 
                 time.hour, time.minute, time.second);
      } else {
        it.printf(480, 250, id(font_medium), TextAlign::TOP_CENTER,
                  "Time: Not synced");
        ESP_LOGW("display", "Time not synchronized yet");
      }
      
      // WiFi info
      if (id(wifi_signal_db).has_state()) {
        it.printf(480, 320, id(font_small), TextAlign::TOP_CENTER,
                  "WiFi: %.0f dBm", id(wifi_signal_db).state);
      }
      
      // IP Address - use ESPHome network API instead of Arduino WiFi
      auto ips = network::get_ip_addresses();
      if (!ips.empty()) {
        it.printf(480, 350, id(font_small), TextAlign::TOP_CENTER,
                  "IP: %s", ips[0].str().c_str());
      } else {
        it.printf(480, 350, id(font_small), TextAlign::TOP_CENTER,
                  "IP: Keine Verbindung");
      }
      
      // Sleep info
      it.printf(480, 390, id(font_small), TextAlign::TOP_CENTER,
                "Sleeping for 5 minutes...");
      it.printf(480, 420, id(font_small), TextAlign::TOP_CENTER,
                "Press button to wake early");
      
      // Footer - use direct millis() for accurate uptime
      float uptime = millis() / 1000.0;
      it.printf(480, 500, id(font_small), TextAlign::BOTTOM_CENTER,
                "Uptime: %.1fs", uptime);
      
      ESP_LOGI("display", "Display update complete");

# ═══════════════════════════════════════════════════════════
# SCRIPT: Update display then sleep
# ═══════════════════════════════════════════════════════════
script:
  - id: update_and_sleep
    mode: single
    then:
      - logger.log: "Starting update and sleep sequence..."
      
      # Wait for WiFi with timeout
      - wait_until:
          condition:
            wifi.connected:
          timeout: 15s
      
      - if:
          condition:
            wifi.connected:
          then:
            - delay: 2s  # Give WiFi more time to fully initialize and get IP
            - logger.log: "✓ WiFi connected"
            - lambda: |-
                auto ips = network::get_ip_addresses();
                if (!ips.empty()) {
                  ESP_LOGI("wifi", "IP Address: %s", ips[0].str().c_str());
                } else {
                  ESP_LOGW("wifi", "No IP address available yet!");
                }
          else:
            - logger.log:
                format: "⚠️ WiFi timeout - no connection!"
                level: ERROR
      
      # Wait for API connection to Home Assistant (with timeout)
      - wait_until:
          condition:
            api.connected:
          timeout: 15s
      - if:
          condition:
            api.connected:
          then:
            - logger.log: "✓ API connected"
          else:
            - logger.log:
                format: "⚠️ API timeout - continuing without time sync"
                level: WARN
      
      # Wait for time sync (with timeout) - only if API is connected
      - if:
          condition:
            api.connected:
          then:
            - wait_until:
                condition:
                  lambda: 'return id(homeassistant_time).now().is_valid();'
                timeout: 10s
      - if:
          condition:
            lambda: 'return id(homeassistant_time).now().is_valid();'
          then:
            - logger.log: "✓ Time synchronized"
          else:
            - logger.log:
                format: "⚠️ Time sync timeout - continuing anyway"
                level: WARN
      
      # Update display
      - component.update: lilygo_display
      - logger.log: "✓ Display updated"
      
      # Wait for display to finish rendering
      - delay: 3s
      
      # Log before entering deep sleep
      - logger.log: "Going to sleep now..."
      - logger.log:
          format: "Next wake in 5 minutes or by button press"
          level: INFO
      
      # Enter deep sleep
      - deep_sleep.enter: deep_sleep_control
      
      # If we reach here, deep sleep FAILED!
      - delay: 1s
      - logger.log:
          format: "❌ CRITICAL: Failed to enter deep sleep!"
          level: ERROR
      - logger.log:
          format: "Device will stay awake - check deep sleep configuration!"
          level: ERROR

# ═══════════════════════════════════════════════════════════
# AUTOMATION: Auto-update on boot
# ═══════════════════════════════════════════════════════════
interval:
  - interval: 2s
    then:
      - if:
          condition:
            # Only run once after boot (when uptime is less than 5 seconds)
            lambda: 'return id(uptime_seconds).state < 5;'
          then:
            - script.execute: update_and_sleep
  
  # Monitor if deep sleep fails
  - interval: 30s
    then:
      - if:
          condition:
            # If device is awake for more than 60 seconds, deep sleep likely failed
            lambda: 'return id(uptime_seconds).state > 60;'
          then:
            - logger.log:
                format: "⚠️ WARNING: Device still awake after %.0f seconds - DeepSleep may have FAILED!"
                args: ['id(uptime_seconds).state']
                level: ERROR

