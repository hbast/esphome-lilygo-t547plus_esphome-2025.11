esphome:
  name: lilygo-t5-47-plus-hardware
  on_boot:
    priority: -100
    then:
      - component.update: epaper

packages:
  base: !include base.yaml

globals:
  - id: last_touch_x
    type: int
    initial_value: "-1"
  - id: last_touch_y
    type: int
    initial_value: "-1"
  - id: battery_percent
    type: float
    initial_value: "-1.0"

display:
  - platform: lilygo_t5_47_plus
    id: epaper
    update_interval: never
    lambda: |-
      it.fill(COLOR_OFF);
      it.rectangle(10, 10, 940, 520, COLOR_ON);

      // Battery level: ten boxes from 0 to 100 percent.
      for (int box = 0; box < 10; box++) {
        const int x = 30 + box * 70;
        it.rectangle(x, 30, 55, 45, COLOR_ON);
        if (id(battery_percent) >= (box + 1) * 10) {
          it.filled_rectangle(x + 5, 35, 45, 35, COLOR_ON);
        }
      }

      // Sixteen logical E-Paper gray levels, white to black.
      for (int level = 0; level < 16; level++) {
        const uint8_t value = level * 17;
        it.filled_rectangle(30 + level * 55, 120, 55, 180,
                            Color(value, value, value));
      }

      // The most recent transformed touch position.
      if (id(last_touch_x) >= 0 && id(last_touch_y) >= 0) {
        it.filled_circle(id(last_touch_x), id(last_touch_y), 18, COLOR_ON);
      }

touchscreen:
  - platform: lilygo_t5_47_plus
    display: epaper
    i2c_id: lilygo_t5_47_plus_i2c
    update_interval: 100ms
    transform:
      swap_xy: true
      mirror_y: true
    on_touch:
      - lambda: |-
          id(last_touch_x) = touch.x;
          id(last_touch_y) = touch.y;
      - component.update: epaper

sensor:
  - platform: lilygo_t5_47_plus
    update_interval: 60s
    battery_level:
      id: board_battery_level
      internal: true
      on_value:
        then:
          - lambda: id(battery_percent) = x;
          - component.update: epaper
