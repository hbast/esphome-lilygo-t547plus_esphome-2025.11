esphome:
  name: lilygo-t5-47-plus-test-sleep
  on_boot:
    priority: -100
    then:
      - component.update: epaper

packages:
  base: !include base.yaml

display:
  - platform: lilygo_t5_47_plus
    id: epaper
    update_interval: never
    lambda: |-
      it.fill(COLOR_OFF);
      it.circle(480, 270, 120, COLOR_ON);

deep_sleep:
  run_duration: 30s
  sleep_duration: 5min
  wakeup_pin:
    number: GPIO21
    inverted: true
  wakeup_pin_mode: INVERT_WAKEUP
