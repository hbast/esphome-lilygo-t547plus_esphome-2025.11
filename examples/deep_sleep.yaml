esphome:
  name: lilygo-t5-47-plus-deep-sleep
  friendly_name: LILYGO T5 4.7 Plus Deep Sleep
  on_boot:
    priority: -100
    then:
      - component.update: epaper

packages:
  lilygo_t5_47_plus: github://hbast/lilygo_t5_47_plus/packages/lilygo_t5_47_plus.yaml@main

logger:
  hardware_uart: USB_SERIAL_JTAG

display:
  - platform: lilygo_t5_47_plus
    id: epaper
    update_interval: never
    lambda: |-
      it.fill(COLOR_OFF);
      it.rectangle(20, 20, 920, 500, COLOR_ON);
      it.circle(480, 270, 120, COLOR_ON);

deep_sleep:
  id: deep_sleep_control
  run_duration: 30s
  sleep_duration: 5min
  wakeup_pin:
    number: GPIO21
    inverted: true
  wakeup_pin_mode: INVERT_WAKEUP
