esphome:
  name: lilygo-clock
  friendly_name: LilyGo E-Ink Clock

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
    sdkconfig_options:
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_SPEED_80M: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "16384"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_ESP32S3_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_BOOT_INIT: "y"
      CONFIG_SPIRAM_IGNORE_NOTFOUND: "n"

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  ap:
    ssid: "Clock Fallback"
    password: "12345678"

captive_portal:

# Zeit von Home Assistant
time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Berlin

# Externes Display-Komponente
external_components:
  - source:
      type: local
      path: components
    components: ["t547"]

# Schriftarten
font:
  - file: 
      type: gfonts
      family: Roboto
      weight: 700
    id: font_huge
    size: 120
    
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_large
    size: 60
    
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_medium
    size: 32

# Display - aktualisiert alle 2 Minuten
display:
  - platform: t547
    id: lilygo_display
    greyscale: true
    update_interval: 2min
    
    lambda: |-
      // Clear screen
      it.fill(COLOR_OFF);
      
      // Current time - BIG
      auto time = id(ha_time).now();
      if (time.is_valid()) {
        it.strftime(480, 150, id(font_huge), TextAlign::CENTER, "%H:%M", time);
        it.strftime(480, 280, id(font_large), TextAlign::CENTER, "%A, %d. %B %Y", time);
      } else {
        it.printf(480, 200, id(font_large), TextAlign::CENTER, "Warte auf Zeit...");
      }
      
      // WiFi Signal
      if (id(wifi_signal_db).has_state()) {
        it.printf(480, 400, id(font_medium), TextAlign::CENTER, "WiFi: %.0f dBm", id(wifi_signal_db).state);
      }
      
      // IP Address
      auto ips = network::get_ip_addresses();
      if (!ips.empty()) {
        it.printf(480, 440, id(font_medium), TextAlign::CENTER, "IP: %s", ips[0].str().c_str());
      } else {
        it.printf(480, 440, id(font_medium), TextAlign::CENTER, "IP: Keine Verbindung");
      }

# WiFi Signal Sensor
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
